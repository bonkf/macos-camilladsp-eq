title: "Work Desk - Flat Bypass (Level-Matched A/B Reference)"
description: "Flat passthrough at -7.5 dB for gapless loudness-matched A/B comparison (Focal Clear Mg Pro & Adam A3X)"

devices:
  samplerate: 48000
  chunksize: 1024
  enable_rate_adjust: true
  capture:
    type: CoreAudio
    channels: 2
    device: "BlackHole 2ch"
  playback:
    type: CoreAudio
    channels: 2
    device: "Schiit USB Audio Gen 2"

filters:
  preamp:
    type: Gain
    parameters:
      gain: -7.5
      scale: dB

pipeline:
  - type: Filter
    channels: [0, 1]
    names:
      - preamp
